<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>BLIP V3.0 | Enterprise Grading OS</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <style>
        :root {
            --bg: #09090b; --surface: #18181b; --surface-hover: #27272a;
            --border: #3f3f46; --text: #f4f4f5; --muted: #a1a1aa;
            --primary: #3b82f6; --success: #22c55e; --warning: #eab308; --danger: #ef4444;
            --radius: 12px;
        }
        * { margin: 0; padding: 0; box-sizing: border-box; font-family: 'Inter', sans-serif; }
        body { background: var(--bg); color: var(--text); padding: 2rem; display: flex; justify-content: center; }
        .container { width: 100%; max-width: 1200px; }
        
        header { margin-bottom: 2rem; border-bottom: 1px solid var(--border); padding-bottom: 1rem; }
        .badge { background: rgba(59, 130, 246, 0.15); color: var(--primary); padding: 4px 12px; border-radius: 20px; font-size: 0.8rem; font-weight: bold; letter-spacing: 1px; }
        h1 { font-size: 2.5rem; margin-top: 0.5rem; }
        
        /* Input Area */
        .workspace { background: var(--surface); padding: 1.5rem; border-radius: var(--radius); border: 1px solid var(--border); margin-bottom: 2rem; }
        textarea { width: 100%; height: 200px; background: var(--bg); color: var(--text); padding: 1rem; border: 1px solid var(--border); border-radius: 8px; font-size: 1rem; line-height: 1.5; resize: vertical; }
        textarea:focus { outline: none; border-color: var(--primary); }
        .btn-run { background: var(--primary); color: white; border: none; padding: 1rem 2rem; border-radius: 8px; font-size: 1rem; font-weight: bold; cursor: pointer; float: right; margin-top: 1rem; transition: 0.2s; }
        .btn-run:hover { opacity: 0.9; transform: translateY(-2px); }

        /* Dashboard Table */
        #dashboard { display: none; }
        .stats-row { display: grid; grid-template-columns: repeat(3, 1fr); gap: 1rem; margin-bottom: 2rem; }
        .stat-card { background: var(--surface); padding: 1.5rem; border-radius: var(--radius); border: 1px solid var(--border); text-align: center; }
        .stat-value { font-size: 2.5rem; font-weight: bold; color: var(--primary); }
        
        .table-container { background: var(--surface); border-radius: var(--radius); border: 1px solid var(--border); overflow: hidden; }
        table { width: 100%; border-collapse: collapse; }
        th, td { padding: 1rem; text-align: left; border-bottom: 1px solid var(--border); }
        th { background: rgba(255,255,255,0.02); font-weight: 600; color: var(--muted); }
        tr:hover { background: var(--surface-hover); }
        
        .view-btn { background: transparent; color: var(--primary); border: 1px solid var(--primary); padding: 6px 12px; border-radius: 6px; cursor: pointer; }
        .view-btn:hover { background: var(--primary); color: white; }

        /* Modal for Detailed Logs */
        .modal-overlay { display: none; position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.8); backdrop-filter: blur(4px); z-index: 100; justify-content: center; align-items: center; padding: 2rem; }
        .modal { background: var(--surface); width: 100%; max-width: 800px; max-height: 90vh; overflow-y: auto; border-radius: var(--radius); border: 1px solid var(--border); padding: 2rem; }
        .modal-header { display: flex; justify-content: space-between; margin-bottom: 1.5rem; border-bottom: 1px solid var(--border); padding-bottom: 1rem; }
        .close-btn { background: transparent; border: none; color: var(--muted); font-size: 1.5rem; cursor: pointer; }
        
        /* Breakdown Items */
        .log-item { background: var(--bg); border: 1px solid var(--border); padding: 1rem; border-radius: 8px; margin-bottom: 1rem; }
        .log-header { display: flex; justify-content: space-between; margin-bottom: 0.5rem; font-weight: bold; }
        .tag { display: inline-block; padding: 2px 8px; border-radius: 4px; font-size: 0.8rem; margin-right: 5px; margin-top: 5px; font-weight: 600; }
        .tag-success { background: rgba(34, 197, 94, 0.1); color: var(--success); border: 1px solid var(--success); }
        .tag-danger { background: rgba(239, 68, 68, 0.1); color: var(--danger); border: 1px solid var(--danger); }
        .tag-core-fail { background: #7f1d1d; color: #fca5a5; border: 1px solid #ef4444; } /* Severe failure */
    </style>
</head>
<body>

<div class="container">
    <header>
        <span class="badge">V3.0 Enterprise Engine</span>
        <h1>BLIP Grading OS</h1>
        <p style="color: var(--muted);">NLP Chunker & Core Axiom Logic Gates</p>
    </header>

    <div class="workspace" id="input-area">
        <h3 style="margin-bottom: 1rem;">Batch Student Submission (Raw Text)</h3>
        <textarea id="batch-text" placeholder="Paste multiple students' answers here...&#10;Ensure each student's paper starts with 'REGISTRATION NUMBER'"></textarea>
        <button class="btn-run" onclick="processBatch()">Grade Entire Class</button>
        <div style="clear: both;"></div>
    </div>

    <div id="dashboard">
        <div class="stats-row">
            <div class="stat-card">
                <div class="stat-value" id="stat-count">0</div>
                <div style="color: var(--muted);">Students Graded</div>
            </div>
            <div class="stat-card">
                <div class="stat-value" id="stat-avg">0%</div>
                <div style="color: var(--muted);">Class Average</div>
            </div>
            <div class="stat-card">
                <div class="stat-value" id="stat-time">0.1s</div>
                <div style="color: var(--muted);">Processing Time</div>
            </div>
        </div>

        <div class="table-container">
            <table>
                <thead>
                    <tr>
                        <th>Registration No.</th>
                        <th>Score</th>
                        <th>Status</th>
                        <th>Action</th>
                    </tr>
                </thead>
                <tbody id="student-table-body">
                    </tbody>
            </table>
        </div>
        <button class="view-btn" style="margin-top: 2rem;" onclick="location.reload()">Back to Input</button>
    </div>
</div>

<div class="modal-overlay" id="modal">
    <div class="modal">
        <div class="modal-header">
            <h2 id="modal-title">Student Logs</h2>
            <button class="close-btn" onclick="document.getElementById('modal').style.display='none'">&times;</button>
        </div>
        <div id="modal-content"></div>
    </div>
</div>

<script>
    /* =========================================================================
       BLIP V3.0 ENGINE: NLP CHUNKER + CORE AXIOM GATES
       ========================================================================= */

    const dictionary = {
        "heterogeneity": ["heterogeneity", "differences", "variation", "variability"],
        "absence": ["absence", "lack of", "no", "without", "does not change", "does not vary"],
        "beneficial": ["beneficial", "helpful", "useful", "important"],
        "essentiality": ["essentiality", "essential", "crucial", "necessary", "required"]
    };

    const negationWords = ["not", "no", "don't", "doesn't", "lack", "without", "absent", "isn't", "aren't"];

    // V3 RULEBOOK (Added 'isCore' Must-Pass Gates)
    const rulebook = [
        {
            id: "Q1_A_i", title: "Q1. A(i) Field invariabilities", type: "text", max: 0.5,
            regexDetect: /(?:1\s*A\s*i\)|field invariab)/i,
            axioms: [
                { keywords: ["absence", "does not change", "no"], weight: 0.5, desc: "Absence/No change" },
                { keywords: ["heterogeneity", "variation", "vary"], weight: 0.5, desc: "Heterogeneity/Variation" }
            ]
        },
        {
            id: "Q1_A_ii", title: "Q1. A(ii) Beneficial nutrients", type: "text", max: 0.5,
            regexDetect: /(?:1\s*A\s*ii\)|beneficial nut)/i,
            axioms: [
                // MUST-PASS GATE: If they miss the negation (e.g. say "is essential"), they fail the whole question.
                { keywords: ["essentiality", "essential", "required"], weight: 0.6, requiresNegation: true, isCore: true, desc: "CORE: Must state they are NOT essential" },
                { keywords: ["beneficial", "roles", "growth", "important"], weight: 0.4, desc: "Plays a beneficial role" }
            ]
        },
        {
            id: "Q6_B_i", title: "Q6. B(i) Calculate % loss in water", type: "math", max: 5.5,
            regexDetect: /(?:6\s*B\s*i|percentage loss|18\s*Mg)/i,
            axioms: [
                { value: 16.2, tolerance: 0.2, weight: 0.5, desc: "Calculated (16.2%)" },
                { value: 1.8, tolerance: 0.1, weight: 0.5, desc: "Final Answer (1.8%)" }
            ]
        },
        {
            id: "Q6_B_ii", title: "Q6. B(ii) Calculate total payment", type: "math", max: 8.0,
            regexDetect: /(?:6\s*B\s*ii|how much will the buyer pay)/i,
            axioms: [
                { value: 13.3, tolerance: 0.1, weight: 0.3, desc: "Actual weight (~13.3 Mg)" },
                { value: 133.33, tolerance: 0.1, weight: 0.3, desc: "Total bags (~133.33 bags)" },
                { value: 9333310, tolerance: 100, weight: 0.4, desc: "Final Payment (~9,333,310 Tsh)" }
            ]
        }
    ];

    function normalizeText(text) {
        let clean = text.toLowerCase().replace(/[(),]/g, " ");
        for (const [standard, synonyms] of Object.entries(dictionary)) {
            synonyms.forEach(syn => {
                const regex = new RegExp(`\\b${syn}\\b`, 'g');
                clean = clean.replace(regex, standard);
            });
        }
        return clean;
    }

    function extractNumbers(text) {
        let clean = text.replace(/,/g, "");
        let matches = clean.match(/\d+(\.\d+)?/g);
        return matches ? matches.map(Number) : [];
    }

    // THE V3 NLP CHUNKER (Smart context extraction)
    function extractQuestionBlock(fullText, currentRegex) {
        let lines = fullText.split('\n');
        let block = [];
        let capturing = false;
        let captureLength = 0;

        for (let i = 0; i < lines.length; i++) {
            if (currentRegex.test(lines[i])) capturing = true;
            
            if (capturing) {
                block.push(lines[i]);
                captureLength++;
                // Break if we hit a new major question number (e.g., 07. Question, B), C))
                // Only break after capturing at least a few lines to avoid false stops
                if (captureLength > 1 && /^(?:Q?\d+\.|\d+\)|\s*[A-Z]\)|\s*[A-Z]\.)/i.test(lines[i])) {
                    // Check if it's just a list item inside the answer (e.g. a), b))
                    if(!/^[a-e]\)/i.test(lines[i].trim())) break; 
                }
            }
        }
        return block.length > 0 ? block.join(" ") : fullText;
    }

    // STUDENT GRADER
    function evaluateStudent(studentText) {
        let results = [];
        let totalPossible = 0;
        let totalEarned = 0;

        rulebook.forEach(rule => {
            totalPossible += rule.max;
            let earned = 0;
            let tags = [];
            let coreFailed = false; // The executioner flag
            
            let targetText = extractQuestionBlock(studentText, rule.regexDetect);

            if (rule.type === "text") {
                let normText = normalizeText(targetText);
                
                rule.axioms.forEach(axiom => {
                    let axiomPassed = false;
                    for (let kw of axiom.keywords) {
                        let idx = normText.indexOf(kw);
                        if (idx !== -1) {
                            let contextBefore = normText.substring(Math.max(0, idx - 40), idx);
                            let hasNegation = negationWords.some(neg => new RegExp(`\\b${neg}\\b`).test(contextBefore));
                            if (axiom.requiresNegation) axiomPassed = hasNegation;
                            else axiomPassed = !hasNegation;
                            
                            if(axiomPassed) break;
                        }
                    }

                    if (axiomPassed) {
                        earned += rule.max * axiom.weight;
                        tags.push(`<span class="tag tag-success">✔ ${axiom.desc}</span>`);
                    } else {
                        // V3 MUST-PASS GATE TRIGGER
                        if (axiom.isCore) {
                            coreFailed = true;
                            tags.push(`<span class="tag tag-core-fail">⛔ FATAL: Failed Core Axiom (${axiom.desc})</span>`);
                        } else {
                            tags.push(`<span class="tag tag-danger">✖ Missing: ${axiom.desc}</span>`);
                        }
                    }
                });
            } 
            else if (rule.type === "math") {
                let numbers = extractNumbers(targetText);
                rule.axioms.forEach(axiom => {
                    let matched = numbers.find(n => Math.abs(n - axiom.value) <= axiom.tolerance);
                    if (matched !== undefined) {
                        earned += rule.max * axiom.weight;
                        tags.push(`<span class="tag tag-success">✔ Found ~${matched}</span>`);
                    } else {
                        if (axiom.isCore) coreFailed = true;
                        tags.push(`<span class="tag tag-danger">✖ Missed Target: ${axiom.value}</span>`);
                    }
                });
            }

            // V3 EXECUTION: If core failed, wipe all marks for this question
            if (coreFailed) earned = 0;

            earned = Math.round(earned * 100) / 100;
            totalEarned += earned;

            results.push({ title: rule.title, max: rule.max, earned: earned, tags: tags.join('') });
        });

        return { earned: totalEarned, possible: totalPossible, perc: (totalEarned / totalPossible) * 100, logs: results };
    }

    // BATCH PROCESSOR
    let globalClassData = [];

    function processBatch() {
        const rawText = document.getElementById('batch-text').value;
        if(!rawText.trim()) return alert("Bosi, paste data first!");

        const startTime = performance.now();

        // 1. Auto-Splitter by REGISTRATION NUMBER
        // Note: Using lookahead to keep the separator
        const studentsRaw = rawText.split(/(?=REGISTRATION NUMBER)/i).filter(s => s.trim().length > 20);
        
        globalClassData = [];
        let totalClassPerc = 0;

        studentsRaw.forEach(studentText => {
            // Extract Reg Number
            const regMatch = studentText.match(/REGISTRATION NUMBER\s*([A-Z0-9-]+)/i);
            const regNo = regMatch ? regMatch[1] : "UNKNOWN-" + Math.floor(Math.random()*1000);
            
            const report = evaluateStudent(studentText);
            totalClassPerc += report.perc;
            globalClassData.push({ regNo, report });
        });

        const endTime = performance.now();
        
        // Update Dashboard
        document.getElementById('input-area').style.display = 'none';
        document.getElementById('dashboard').style.display = 'block';
        
        document.getElementById('stat-count').innerText = globalClassData.length;
        document.getElementById('stat-avg').innerText = globalClassData.length > 0 ? (totalClassPerc / globalClassData.length).toFixed(1) + '%' : '0%';
        document.getElementById('stat-time').innerText = ((endTime - startTime) / 1000).toFixed(2) + 's';

        // Build Table
        const tbody = document.getElementById('student-table-body');
        tbody.innerHTML = '';
        globalClassData.forEach((student, index) => {
            let p = student.report.perc;
            let status = p >= 75 ? '<span style="color:var(--success)">Distinction</span>' : (p >= 50 ? '<span style="color:var(--warning)">Pass</span>' : '<span style="color:var(--danger)">Fail</span>');
            
            tbody.innerHTML += `
                <tr>
                    <td style="font-weight:bold;">${student.regNo}</td>
                    <td>${student.report.earned.toFixed(2)} / ${student.report.possible} (${p.toFixed(1)}%)</td>
                    <td>${status}</td>
                    <td><button class="view-btn" onclick="viewLogs(${index})">View Logs</button></td>
                </tr>
            `;
        });
    }

    function viewLogs(index) {
        const student = globalClassData[index];
        document.getElementById('modal-title').innerText = `Logs: ${student.regNo} (${student.report.perc.toFixed(1)}%)`;
        
        let content = '';
        student.report.logs.forEach(log => {
            let color = log.earned === log.max ? 'var(--success)' : (log.earned === 0 ? 'var(--danger)' : 'var(--warning)');
            content += `
                <div class="log-item">
                    <div class="log-header">
                        <span>${log.title}</span>
                        <span style="color: ${color}">${log.earned} / ${log.max} marks</span>
                    </div>
                    <div>${log.tags}</div>
                </div>
            `;
        });
        
        document.getElementById('modal-content').innerHTML = content;
        document.getElementById('modal').style.display = 'flex';
    }
</script>
</body>
</html>
